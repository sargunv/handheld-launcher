name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Clippy builds the session's desktop runner, which needs ALSA and
      # libudev.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libudev-dev
      - run: mise run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
      # The session's test cores build against GL and GL ES and render with
      # Mesa's EGL, or with Vulkan on Mesa's lavapipe.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libgl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri libvulkan1
          mesa-vulkan-drivers
      - run: mise run android:ndk
      # The session's test fixtures, which fixtures.sh builds from the sources
      # fixture-sources.sh pins.
      - uses: actions/cache@v6
        with:
          path: ${{ env.HANDHELD_SESSION_FIXTURES }}
          key:
            session-fixtures-${{ hashFiles('session/fixtures.sh',
            'session/fixture-sources.sh', 'session/tests/cores/events.c') }}
      - run: mise run build
      - run: mise run test
        env:
          HANDHELD_REQUIRE_EGL: "1"
          HANDHELD_REQUIRE_VULKAN: "1"
      # The session's build script compiles rcheevos, so the Android check needs
      # the NDK's compiler, which cargo-ndk sets, as in Gradle's build.
      - run: |
          source session/fixture-sources.sh
          cargo ndk --target arm64-v8a --platform "$(android_min_sdk)" \
            clippy -p handheld-session --all-targets -- -D warnings
