name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Clippy builds the session's desktop runner, which needs ALSA and
      # libudev.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libudev-dev
      - run: mise run check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: gradle/actions/setup-gradle@v6
      # The session's test cores build against GL and GL ES and render with
      # Mesa's EGL, or with Vulkan on Mesa's lavapipe.
      - run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libgl-dev libgles-dev libegl-mesa0 libgl1-mesa-dri libvulkan1
          mesa-vulkan-drivers
      # The session's Android build uses the NDK that libs.versions.toml pins.
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "ndk;$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p'
          gradle/libs.versions.toml)"
      # The session's test fixtures, which fixtures.sh builds from the sources
      # fixture-sources.sh pins.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/handheld/session-fixtures
          key:
            session-fixtures-${{ hashFiles('session/fixtures.sh',
            'session/fixture-sources.sh', 'session/tests/cores/events.c') }}
      - run: mise run build
      - run: mise run test
        env:
          HANDHELD_REQUIRE_EGL: "1"
          HANDHELD_REQUIRE_VULKAN: "1"
      # The session's build script compiles rcheevos, so the Android check needs
      # the NDK's compiler, as Gradle's Android build sets it.
      - run: |
          ndk="$ANDROID_HOME/ndk/$(sed -n 's/^android-ndk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          min_sdk="$(sed -n 's/^android-minSdk = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC_aarch64_linux_android="$bin/aarch64-linux-android$min_sdk-clang" \
            AR_aarch64_linux_android="$bin/llvm-ar" \
            cargo clippy -p handheld-session --target aarch64-linux-android \
            --all-targets -- -D warnings
