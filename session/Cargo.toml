[package]
name = "handheld-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "handheld_session"

[[bin]]
name = "session-runner"
required-features = ["runner"]

[features]
# The desktop development runner. It needs ALSA and libudev headers on Linux.
runner = [
  "dep:clap",
  "dep:cpal",
  "dep:env_logger",
  "dep:gilrs",
  "dep:softbuffer",
  "dep:winit",
]

[dependencies]
ash = "0.38.0"
glow = "0.18.0"
libloading = "0.9.1"
log = "0.4.35"
rubato = { version = "5.1.0", default-features = false }
thiserror = "2.0.21"
uniffi = "0.32.2"
zip = { version = "9.8.2", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

clap = { version = "4.6.10", features = ["derive"], optional = true }
cpal = { version = "0.18.2", optional = true }
env_logger = { version = "0.11.12", optional = true }
gilrs = { version = "0.11.2", optional = true }
softbuffer = { version = "0.4.8", optional = true }
winit = { version = "0.30.13", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"
ndk = { version = "0.9.0", default-features = false, features = [
  "api-level-30",
  "audio",
] }
rtrb = "0.4.1"

[dev-dependencies]
png = "0.18.1"
sha2 = "0.11.2"
tempfile = "3.27.0"
