[settings]
experimental = true
pin = true
lockfile = true
lockfile_mode = "merge"

[tools]
"aqua:dprint/dprint" = "0.65.0"
"aqua:jdx/hk" = "2.14.0"
"aqua:jdx/jactionlint" = "2.6.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"core:java" = "zulu-25.38.201.0"
"core:rust" = { version = "1.100.0", profile = "minimal", components = "rustfmt,clippy", targets = "aarch64-linux-android,x86_64-linux-android" }
"github:jdx/fnox" = "1.50.0"

[env]
# The runner images set ANDROID_HOME; locally it defaults to Android Studio's path.
ANDROID_HOME = "{% if os() == 'macos' %}{% set sdk = env.HOME ~ '/Library/Android/sdk' %}{% else %}{% set sdk = env.HOME ~ '/Android/Sdk' %}{% endif %}{{ get_env(name='ANDROID_HOME', default=sdk) }}"

[tasks.check]
description = "Run the formatters and linters"
run = "hk check --all"

[tasks.fix]
description = "Apply formatter and linter fixes"
run = "hk fix --all"

[tasks.build]
description = "Build the Android and desktop apps and the session crate"
run = ["./gradlew assemble", "cargo build --workspace"]

[tasks.test]
description = "Run the Kotlin and Rust tests"
depends = ["session:fixtures"]
run = ["./gradlew check", "cargo test --workspace"]

[tasks."test:live"]
description = "Sync the dev RomM server's library read-only, with credentials from fnox"
run = "fnox exec -- ./gradlew :data:jvmTest --tests '*LiveLibrarySyncTest' --rerun"

[tasks."run:desktop"]
description = "Run the desktop app"
run = "./gradlew :apps:desktop:run"

[tasks."android:debug-key"]
description = "Unpack the project's shared debug signing key from fnox"
run = """
k=apps/android/debug.keystore
[ -f "$k" ] && exit 0
b64="$(fnox get ANDROID_DEBUG_KEYSTORE)"
f="$(mktemp)"
printf %s "$b64" | base64 -d > "$f" && mv "$f" "$k"
"""

[tasks."run:android"]
description = "Install and launch the debug app on the connected device"
depends = ["android:debug-key"]
# It builds first, then installs and launches while holding the device's lock.
run = [
  "./gradlew :apps:android:assembleDebug",
  """apps/android/scripts/with-device-lock.sh sh -c '
    ./gradlew :apps:android:installDebug &&
    adb shell am start -W -n dev.sargunv.handheld/.MainActivity ${HANDHELD_LAYOUT:+--es layout $HANDHELD_LAYOUT}
  '""",
]

[tasks."android:lock"]
description = "Run a command while holding the connected device's lock"
run = "apps/android/scripts/with-device-lock.sh"

[tasks."android:screenshot"]
description = "Save a screenshot of the connected device to a temp file and print its path"
# A directory, since macOS's mktemp can't add a suffix to a file name.
run = 'f="$(mktemp -d)/screen.png" && adb exec-out screencap -p > "$f" && echo "$f"'

[tasks."android:action"]
description = "Send a semantic action to the app on the connected device"
usage = 'arg "<action>" help="up, down, left, right, confirm, back, menu, search, previous-shelf, next-shelf, quick-menu or select"'
# Keyboard keys mean the same action whichever button confirms.
run = """
case "$usage_action" in
  up) key=DPAD_UP ;;
  down) key=DPAD_DOWN ;;
  left) key=DPAD_LEFT ;;
  right) key=DPAD_RIGHT ;;
  confirm) key=ENTER ;;
  back) key=ESCAPE ;;
  menu) key=TAB ;;
  search) key=SLASH ;;
  previous-shelf) key=PAGE_UP ;;
  next-shelf) key=PAGE_DOWN ;;
  quick-menu) key=F1 ;;
  select) key=F2 ;;
  *) echo "unknown action: $usage_action" >&2; exit 2 ;;
esac
adb shell input -d 0 keyevent "KEYCODE_$key"
"""

[tasks."android:open"]
description = "Show a screen of the debug app on the connected device straight away"
usage = 'arg "<target>" help="place:home, place:library, place:downloads, game:<romId>, library or library:<platform-slug>"'
run = 'adb shell am start -W -n dev.sargunv.handheld/.MainActivity --es open "$usage_target" ${HANDHELD_LAYOUT:+--es layout $HANDHELD_LAYOUT}'

[tasks."android:ui"]
description = "Print the debug app's focused element and visible elements, on every display"
run = "apps/android/scripts/ui.sh"

[hooks]
postinstall = ["hk install --mise"]

[tasks."session:bindings"]
description = "Regenerate the session's libretro bindings from the vendored libretro.h"
tools = { "cargo:bindgen-cli" = "0.73.2" }
dir = "session"
run = "bindgen vendor/libretro/libretro.h --rust-edition 2024 --rust-target 1.85 --use-core --allowlist-item 'retro_.*|RETRO_.*' --ignore-functions --no-layout-tests --no-doc-comments --no-prepend-enum-name --with-derive-default --sort-semantically -o src/ffi/generated.rs"

[tasks."session:rcheevos-bindings"]
description = "Regenerate the session's rcheevos bindings from the vendored headers"
tools = { "cargo:bindgen-cli" = "0.73.2" }
dir = "session"
run = "bindgen src/achievements/rcheevos.h --rust-edition 2024 --rust-target 1.85 --use-core --allowlist-item 'rc_.*|RC_.*' --blocklist-item 'retro_.*|time_t|__darwin_.*' --raw-line 'use crate::ffi::retro_memory_map;' --raw-line 'type time_t = core::ffi::c_long;' --no-layout-tests --no-doc-comments --no-prepend-enum-name --with-derive-default --sort-semantically -o src/achievements/ffi.rs -- -Ivendor/rcheevos/include -Ivendor/rcheevos/src -Ivendor/libretro -DRC_CLIENT_SUPPORTS_HASH"

[tasks."session:fixtures"]
description = "Build and download the cores and content the session's tests run"
run = "session/fixtures.sh"

[tasks."session:run"]
description = "Run a libretro core in the session's desktop development runner"
run = "cargo run -p handheld-session --features runner --bin session-runner --"

[tasks."session:android-fixtures"]
description = "Build the session's test cores for an Android ABI (session/README.md)"
run = "session/android-fixtures.sh"
